# Included by nginx.conf inside http {}; requires nginx >= 1.27.3.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream school_backend {
    zone school_backend 64k;
    server backend:8081 resolve;
    keepalive 16;
}

upstream school_desktop {
    zone school_desktop 64k;
    server sim:6083 resolve;
    keepalive 4;
}

upstream school_dashboard {
    zone school_dashboard 64k;
    server dashboard:80 resolve;
    keepalive 8;
}

# The origin port must remain loopback-only behind the trusted tunnel.
map $http_x_forwarded_proto $school_forwarded_proto {
    default $scheme;
    https https;
    http http;
}

map $http_upgrade $school_connection {
    default upgrade;
    '' '';
}

# Only successful content-hashed Vite bundles are immutable; HTML and live
# simulation/configuration resources must be fetched again after deployment.
map "$status:$uri" $school_cache_control {
    default "no-store";
    "~^200:/(monitor/|nv-dash/)?assets/[^/]+-[A-Za-z0-9_-]{8,}\.(js|css|woff2?|png|svg|webp|jpg)$" "public, max-age=31536000, immutable";
    ~^200:/simulation/assets/ "public, max-age=0, must-revalidate";
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;
    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;
    keepalive_timeout 65s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $school_cache_control always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $school_forwarded_proto;
    proxy_set_header Connection $school_connection;
    proxy_set_header Upgrade $http_upgrade;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    # Preserve the backend's public WHEP session Location for DELETE.
    proxy_redirect off;

    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/javascript text/css image/svg+xml;


    # OAuth callback query strings contain one-use credentials.
    location /api/v1/auth/oauth/ {
        access_log off;
        proxy_hide_header Referrer-Policy;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://school_backend;
    }

    # 백엔드 API 프록시 (compose 네트워크의 서비스 이름 사용)
    location /api/ {
        proxy_pass http://school_backend;
    }

    location = /health {
        proxy_pass http://school_backend;
    }
    location = /health/ready {
        proxy_pass http://school_backend;
    }
    location = /nv-dash {
        return 302 /nv-dash/;
    }
    location /nv-dash/ {
        proxy_pass http://school_dashboard;
    }

    location /swagger-ui {
        proxy_pass http://school_backend;
    }
    location /api-docs/ {
        proxy_pass http://school_backend;
    }
    location = /simulation/ {
        return 302 /simulation/desktop/vnc.html?autoconnect=true&resize=scale&path=simulation/desktop/websockify;
    }
    location = /simulation {
        return 302 /simulation/;
    }
    location /simulation/desktop/ {
        proxy_pass http://school_desktop/;
        proxy_read_timeout 86400;
    }
    location /simulation/assets/ {
        gzip on;
        gzip_types application/octet-stream model/vnd.collada+xml application/json;
        try_files $uri =404;
    }
    location /simulation/ {
        try_files $uri $uri/ =404;
    }
    location = /webrtc-config.json {
        alias /etc/nginx/webrtc-config.json;
        default_type application/json;
    }
    location = /monitor {
        return 302 /monitor/;
    }
    location /monitor/assets/ {
        try_files $uri =404;
    }
    location /monitor/ {
        try_files $uri $uri/ /monitor/index.html;
    }
    location /assets/ {
        try_files $uri =404;
    }
    # SPA 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
