name: neurovector

# sim 레포(PX4 SITL + Gazebo + ROS 2)는 서브모듈의 compose 를 그대로 가져옵니다.
# sim 서비스는 `sim` 프로필이라 기본 `docker compose up` 에서는 뜨지 않습니다.
# 서브모듈이 초기화되지 않았다면 먼저 `make init` 을 실행하세요.
include:
  - path: sim/compose.yaml

services:
  # ---------------------------------------------------------------- 인프라
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neurovector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurovector}
      POSTGRES_DB: ${POSTGRES_DB:-neurovector}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: nv-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-neurovector}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-neurovector}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  kafka:
    image: apache/kafka:3.9.1
    container_name: nv-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-3}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # kafkadata 볼륨에 로그/메타데이터를 영구 저장
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nv-kafka-ui
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: neurovector
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"

  # ------------------------------------------------------------- MQTT
  mosquitto:
    build:
      context: ./infra/mosquitto
    image: neurovector-mosquitto:${IMAGE_TAG:-local}
    container_name: nv-mosquitto
    restart: unless-stopped
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-neurovector}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-neurovector}
      MQTT_EXTRA_USERS: ${MQTT_EXTRA_USERS:-}
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - mosquittodata:/mosquitto/data
      - mosquittolog:/mosquitto/log
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h localhost -p 1883 -u \"$${MQTT_USERNAME}\" -P \"$${MQTT_PASSWORD}\" -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # ------------------------------------------ SRT / WebRTC / 녹화
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: nv-mediamtx
    restart: unless-stopped
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIA_WEBRTC_ADDITIONAL_HOSTS:-localhost}
    ports:
      # SRT publish/read (UDP)
      - "${MEDIA_SRT_PORT:-8890}:8890/udp"
      # WebRTC WHEP + ICE
      - "${MEDIA_WEBRTC_PORT:-8889}:8889"
      - "${MEDIA_WEBRTC_ICE_PORT:-8189}:8189/udp"
      # MediaMTX control API (로컬 디버깅용)
      - "${MEDIA_API_PORT:-9997}:9997"
    volumes:
      - ./infra/media/mediamtx.yml:/mediamtx.yml:ro
      - recordings:/recordings

  # --------------------------------------------------- DB 마이그레이션 (1회)
  migrate:
    image: pgvector/pgvector:pg16
    container_name: nv-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-neurovector}
      PGPASSWORD: ${POSTGRES_PASSWORD:-neurovector}
      PGDATABASE: ${POSTGRES_DB:-neurovector}
    volumes:
      - ./backend/migrations:/migrations:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        for f in /migrations/*.sql; do
          echo "== applying $$f"
          psql -v ON_ERROR_STOP=1 -f "$$f"
        done

  # ------------------------------------------------------------- 애플리케이션
  backend:
    build:
      context: ./backend
    image: neurovector-backend:${IMAGE_TAG:-local}
    container_name: nv-backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      mediamtx:
        condition: service_started
    environment:
      LISTEN_ADDR: 0.0.0.0:8081
      PUBLIC_BASE_URL: http://localhost:${BACKEND_PORT:-8081}
      DATABASE_URL: postgres://${POSTGRES_USER:-neurovector}:${POSTGRES_PASSWORD:-neurovector}@postgres:5432/${POSTGRES_DB:-neurovector}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
      REDIS_URL: redis://:${REDIS_PASSWORD:-neurovector}@redis:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-neurovector-admin}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-86400}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://127.0.0.1:8081}
      # compose 네트워크에서는 INTERNAL 리스너(29092)를 사용해야 합니다.
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_EVENTS: ${KAFKA_TOPIC_EVENTS:-neurovector.events}
      KAFKA_TOPIC_ORDERS: ${KAFKA_TOPIC_ORDERS:-neurovector.orders}
      MQTT_HOST: mosquitto
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-neurovector}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-neurovector}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-neurovector-backend}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-neurovector}
      MQTT_QOS: ${MQTT_QOS:-1}
      MEDIA_API_BASE_URL: http://mediamtx:9997
      MEDIA_WHEP_BASE_URL: http://mediamtx:8889
      MEDIA_SRT_PUBLIC_HOST: ${MEDIA_SRT_PUBLIC_HOST:-localhost}
      MEDIA_SRT_PORT: ${MEDIA_SRT_PORT:-8890}
      MEDIA_RECORDINGS_DIR: /recordings
      MAX_ALTITUDE_M: ${MAX_ALTITUDE_M:-120}
      ROUTE_MAX_LEG_M: ${ROUTE_MAX_LEG_M:-5000}
      ROUTE_MAX_DISTANCE_M: ${ROUTE_MAX_DISTANCE_M:-20000}
      ROUTE_BATTERY_WH: ${ROUTE_BATTERY_WH:-500}
      ROUTE_POWER_W: ${ROUTE_POWER_W:-300}
      RISK_LOOKBACK_DAYS: ${RISK_LOOKBACK_DAYS:-90}
      RISK_CORRIDOR_M: ${RISK_CORRIDOR_M:-150}
      TELEMETRY_ONLINE_TTL_SECONDS: ${TELEMETRY_ONLINE_TTL_SECONDS:-120}
      RUST_LOG: ${RUST_LOG:-info,tower_http=debug}
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    volumes:
      - recordings:/recordings:ro

  vision:
    build:
      context: ./vision
      args:
        # 1 로 빌드하면 YOLO/OpenCV 포함 (이미지가 커집니다)
        WITH_VISION: ${VISION_WITH_MODEL:-0}
    image: neurovector-vision:${IMAGE_TAG:-local}
    container_name: nv-vision
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEUROVECTOR_HOST: 0.0.0.0
      NEUROVECTOR_PORT: "8082"
      NEUROVECTOR_BACKEND_BASE_URL: http://backend:8081
      NEUROVECTOR_BACKEND_TIMEOUT_SECONDS: ${VISION_BACKEND_TIMEOUT:-5.0}
      NEUROVECTOR_MODEL_PATH: ${VISION_MODEL_PATH:-yolov8n.pt}
      NEUROVECTOR_CONFIDENCE_THRESHOLD: ${VISION_CONFIDENCE_THRESHOLD:-0.35}
      NEUROVECTOR_CAMERA_HORIZONTAL_FOV_DEG: ${VISION_CAMERA_HORIZONTAL_FOV_DEG:-70}
      NEUROVECTOR_OBJECT_SIZES: "${VISION_OBJECT_SIZES:-{}}"
      NEUROVECTOR_DRONE_ID: ${DRONE_ID:-drone-001}
    ports:
      - "${VISION_PORT:-8082}:8082"

  frontend:
    build:
      context: ./frontend
      args:
        # 빈 값 → 같은 오리진(/api) 요청을 nginx 가 backend 로 프록시
        VITE_API_BASE_URL: ""
    image: neurovector-frontend:${IMAGE_TAG:-local}
    container_name: nv-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  pgdata:
  redisdata:
  kafkadata:
  mosquittodata:
  mosquittolog:
  recordings:
